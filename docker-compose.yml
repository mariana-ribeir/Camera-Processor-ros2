services:
  ros2_camera_processor:
    image: camera-processor:jazzy
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera_processor_ws
    volumes:
      - .:/workspaces/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: host.docker.internal:0
      QT_X11_NO_MITSHM: "1"
      OPENCV_VIDEOIO_PRIORITY_GSTREAMER: "0"
      CAMERA_SOURCE: ${CAMERA_SOURCE:-video}
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/dev/video0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-empatica-us-east-1-prod-data}
      S3_PREFIX: ${S3_PREFIX:-v2/2856/}
      PARTICIPANT_ID: ${PARTICIPANT_ID:-1-1-0001}
      GMM_MODEL_PATH: ${GMM_MODEL_PATH:-/workspaces/ros2_ws/src/camera_processor/models/gmm_model.pkl}
      EMPATICA_STATE_FILE: ${EMPATICA_STATE_FILE:-/workspaces/ros2_ws/.cache/empatica_gmm_state.json}
      POLAR_BASELINE_DIR: ${POLAR_BASELINE_DIR:-/workspaces/ros2_ws/.cache/polar_baselines}
      POLAR_LOG_DIR: ${POLAR_LOG_DIR:-/workspaces/ros2_ws/.cache/polar_logs}
      POLAR_MODELS: ${POLAR_MODELS:-logistic_regression,random_forest,svm,xgboost}
      POLAR_INPUT_MODE: ${POLAR_INPUT_MODE:-bridge}
      POLAR_ROSBAG_ENABLED: ${POLAR_ROSBAG_ENABLED:-false}
      POLAR_ROSBAG_CAMERA_IMAGE_RAW_ENABLED: ${POLAR_ROSBAG_CAMERA_IMAGE_RAW_ENABLED:-false}
    # devices:
    #   - "/dev/video0:/dev/video0"
    #group_add:
    #  - video
    ports:
      - "8080:8080"
      - "10000:10000"
      - "8765:8765"
      - "8766:8766/udp"
    stdin_open: true
    tty: true
    command: /bin/bash